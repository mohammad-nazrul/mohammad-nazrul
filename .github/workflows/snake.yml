name: Generate Contribution Snake

on:
  schedule:
    # Twice a day, so the snake never looks stale.
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Generate snake animations
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=7C3AED&color_dots=EBEDF0,C9F5DC,8FE8B8,2FE871,159652
            dist/github-snake-dark.svg?color_snake=9B5CFF&color_dots=161B1A,1B4332,1F7A4D,2FE871,9CFFCB

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
