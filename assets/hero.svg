<svg xmlns="http://www.w3.org/2000/svg" width="860" height="262" viewBox="0 0 860 262" role="img" aria-label="Welcome to Nazrul's Hub — Fintech, Backend, Full Stack, AI / NLP">
  <title>Welcome to Nazrul's Hub — Fintech, Backend, Full Stack, AI / NLP</title>
  <style>
    .t { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
    .m { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .tab { font-variant-numeric: tabular-nums; }
    .enter { animation: enter .6s cubic-bezier(.25,1,.5,1) both; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes enter { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes pulse { 50% { opacity: .4; } }
    
    .drift { animation: drift 16s ease-in-out infinite alternate; }
    .flow { animation: flow 2.8s linear infinite; }
    @keyframes drift { from { transform: translate(-18px, -10px); } to { transform: translate(22px, 14px); } }
    @keyframes flow { to { stroke-dashoffset: -40; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  
  <defs>
    <clipPath id="clip"><rect x="0.5" y="0.5" width="859" height="261" rx="12"/></clipPath>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <radialGradient id="gridFade" cx="0.74" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridMask"><rect width="860" height="262" fill="url(#gridFade)"/></mask>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
