name: Build profile README

on:
  schedule:
    # Daily at 03:17 UTC (11:17 in Kuching) — keeps contributions, repo stats
    # and "updated" dates fresh.
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - profile.config.mjs
      - scripts/**
      - .github/workflows/profile.yml

permissions:
  contents: write

concurrency:
  group: profile-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Render cards and README
        run: node scripts/build.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: a fine-grained token with read-only access to your repos,
          # so private repos count toward "Top Languages".
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Refresh profile cards"
            git push
          fi
