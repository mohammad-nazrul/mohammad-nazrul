name: Generate Contribution Snake

on:
  schedule:
    # Twice a day, so the snake never looks stale.
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Generate snake animations
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=0A0D0A&color_dots=EBEDF0,C7CCC9,9AA5A0,5A625E,0A0D0A
            dist/github-snake-dark.svg?color_snake=EDEFEC&color_dots=161B1A,3A403D,5A625E,9AA5A0,EDEFEC

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
